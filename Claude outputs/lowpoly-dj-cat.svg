<style>
.head{transform-origin:150px 190px;animation:bob 1s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(5px) rotate(3deg)}}
.tail{transform-origin:206px 246px;animation:wag 1s ease-in-out infinite}
@keyframes wag{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}
.arm{transform-box:fill-box;transform-origin:50% 0%}.spinA,.spinB{transform-box:view-box;transform-origin:0 0}
.a0{animation:scr 1s ease-in-out infinite}.a1{animation:scr 1s ease-in-out infinite reverse}
@keyframes scr{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(6deg)}}
.spinA{animation:spin 2s linear infinite}.spinB{animation:spin 2s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.glint{animation:gl 2s ease-in-out infinite}
@keyframes gl{0%,60%,100%{opacity:.25}75%{opacity:1}}
.fader{animation:fd 1s ease-in-out infinite alternate}.f1{animation-delay:-.3s}.f2{animation-delay:-.6s}
@keyframes fd{from{transform:translateY(0)}to{transform:translateY(14px)}}
</style>
